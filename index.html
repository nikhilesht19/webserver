<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - E-Commerce</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #ff9900;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            background: white;
            padding: 50px;
            text-align: center;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #666;
            margin-bottom: 20px;
        }

        .search {
            padding: 12px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .products {
            padding: 40px 50px;
        }

        .products h2 {
            margin-bottom: 25px;
        }

        .product-container {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .product {
            background: white;
            width: 220px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .product-image {
            height: 130px;
            background: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .product h3 {
            margin-bottom: 10px;
        }

        .price {
            color: #e63946;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            background: #ff9900;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #ff7700;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>ShopEasy</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Cart 🛒</a>
    </nav>
</header>

<section class="hero">
    <h2>Welcome to ShopEasy</h2>
    <p>Discover amazing products at great prices.</p>

    <input
        type="text"
        class="search"
        placeholder="Search products..."
    >
</section>

<section class="products">

    <h2>Featured Products</h2>

    <div class="product-container">

        <div class="product">
            <div class="product-image">📱</div>
            <h3>Smartphone</h3>
            <p class="price">₹29,999</p>
            <button onclick="addToCart('Smartphone')">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <div class="product-image">💻</div>
            <h3>Laptop</h3>
            <p class="price">₹59,999</p>
            <button onclick="addToCart('Laptop')">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <div class="product-image">🎧</div>
            <h3>Headphones</h3>
            <p class="price">₹2,999</p>
            <button onclick="addToCart('Headphones')">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <div class="product-image">⌚</div>
            <h3>Smart Watch</h3>
            <p class="price">₹4,999</p>
            <button onclick="addToCart('Smart Watch')">
                Add to Cart
            </button>
        </div>

    </div>

</section>

<footer>
    <p>© 2026 ShopEasy. All Rights Reserved.</p>
</footer>

<script>
    function addToCart(product) {
        alert(product + " added to cart!");
    }
</script>

</body>
</html>
